# Modello dimostrativo (illustrative): non sono termini di legge. Guida §9.
code: AD-1M-v1
label: "Affidamento diretto / ODA / TD / ordinativo (1 mese)"
illustrative: true
durationMonths: 1
selection:
  procedureTypes: [DIRECT_AWARD, DIRECT_AWARD_MEPA, MEPA_ORDER, CENTRAL_PURCHASING_ORDER]
milestones:
  - code: MEMORY_SUBMISSION
    label: "Consegna memoria al Direttore Generale"
    phase: MEMORY_EXPECTED
    owner: STRUCTURE
    mandatory: true
    blocking: true
    offsetDays: 0
    minDurationDays: 0
    alertPolicy: MEMORY
    minLeadDays: 10
    expectedDocuments:
      - { type: MEMORIA, timing: WITH, severity: HIGH }
      - { type: DOCUMENTO_TECNICO, timing: WITH, severity: MEDIUM }
  - code: REVIEW_COMPLETED
    label: "Determina di indizione (a contrarre)"
    phase: PRELIMINARY_REVIEW
    owner: PROCUREMENT
    mandatory: true
    blocking: false
    offsetDays: 7
    minDurationDays: 3
    alertPolicy: STANDARD
    minLeadDays: 10
    expectedDocuments:
      - { type: DETERMINA_INDIZIONE, timing: WITH, severity: HIGH }
  - code: AWARD
    label: "Determina di aggiudicazione"
    phase: TENDERING
    owner: PROCUREMENT
    mandatory: true
    blocking: true
    offsetDays: 10
    minDurationDays: 3
    alertPolicy: BLOCKING
    minLeadDays: 10
    expectedDocuments:
      - { type: DETERMINA_AGGIUDICAZIONE, timing: WITH, severity: HIGH }
  - code: AWARD_EFFECTIVE
    label: "Adempimenti pre-stipula (garanzia, documenti, termine dilatorio)"
    phase: AWARDED
    owner: PROCUREMENT
    mandatory: true
    blocking: false
    offsetDays: 5
    minDurationDays: 2
    alertPolicy: STANDARD
    minLeadDays: 10
    expectedDocuments: []
  - code: CONTRACT_SIGNED
    label: "Stipula (contratto o documento di stipula MePA)"
    phase: CONTRACTING
    owner: PROCUREMENT
    mandatory: true
    blocking: true
    offsetDays: 8
    minDurationDays: 2
    alertPolicy: BLOCKING
    minLeadDays: 10
    expectedDocuments:
      - { type: GARANZIA_DEFINITIVA, timing: BEFORE, severity: HIGH }
      - { type: CONTRATTO, timing: WITH, severity: HIGH }
