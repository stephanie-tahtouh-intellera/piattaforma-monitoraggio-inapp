# Avvio: docker compose up --build  (US-001). Il DB SQLite sta nel volume nominato: mai bind mount di cartelle Windows (CR-41).
x-app: &app
  build: .
  image: inapp-mvp:dev
  environment:
    DATABASE_PATH: /data/inapp.db
    APP_ROOT: /app
    DEMO_DATASET: ${DEMO_DATASET:-inapp}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo2026!}
    APP_REFERENCE_DATE: ${APP_REFERENCE_DATE:-2026-10-01}
    SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    APP_BASE_URL: http://localhost:3000
  volumes:
    - appdata:/data

services:
  init:
    <<: *app
    command: ["pnpm", "cli", "bootstrap"]
    restart: "no"
  web:
    <<: *app
    command: ["pnpm", "start"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["pnpm", "worker"]
    depends_on:
      init: { condition: service_completed_successfully }
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:8025:8025"]

volumes:
  appdata:
